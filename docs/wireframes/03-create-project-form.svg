<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .nav { fill: #1e293b; }
      .nav-text { fill: #ffffff; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 600; }
      .nav-link { fill: #94a3b8; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 8; }
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 24px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: #64748b; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #1e293b; }
      .input-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 6; }
      .input-error { fill: #fff5f5; stroke: #ef4444; stroke-width: 1.5; rx: 6; }
      .input-val { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: #0f172a; }
      .error-msg { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 500; fill: #dc2626; }
      .help-text { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; fill: #64748b; }
      .btn-primary { fill: #2563eb; rx: 6; }
      .btn-text { fill: #ffffff; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; }
      .btn-cancel { fill: #f1f5f9; stroke: #cbd5e1; rx: 6; }
      .btn-cancel-text { fill: #475569; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="800" class="bg"/>

  <!-- Top Navigation Bar -->
  <rect width="1200" height="60" class="nav"/>
  <text x="40" y="36" class="nav-text">PlanFlow</text>
  <text x="140" y="36" class="nav-link">Projects</text>
  <text x="230" y="36" class="nav-link">Task Explorer</text>

  <!-- Container Card -->
  <rect x="250" y="90" width="700" height="680" class="card"/>
  <text x="290" y="135" class="title">Create New Project</text>
  <text x="290" y="160" class="subtitle">Set up a collaborative workspace, establish deliverables and assign initial deadlines.</text>

  <!-- Field 1: Project Title (Valid) -->
  <text x="290" y="200" class="label">Project Title *</text>
  <rect x="290" y="210" width="620" height="42" class="input-box"/>
  <text x="305" y="236" class="input-val">Payment Gateway Modernization</text>
  <text x="290" y="268" class="help-text">Minimum 3 characters, maximum 100 characters.</text>

  <!-- Field 2: Description (Has Error in Wireframe demo) -->
  <text x="290" y="300" class="label">Project Description *</text>
  <rect x="290" y="310" width="620" height="90" class="input-error"/>
  <text x="305" y="335" class="input-val" fill="#ef4444">Short</text>
  <text x="290" y="418" class="error-msg">⚠ Description must be at least 10 characters long.</text>

  <!-- Field 3 & 4 (Columns): Status & Deadline -->
  <g transform="translate(0, 20)">
    <text x="290" y="430" class="label">Initial Status *</text>
    <rect x="290" y="440" width="295" height="42" class="input-box"/>
    <text x="305" y="466" class="input-val">PLANNING ▾</text>

    <text x="615" y="430" class="label">Target Deadline *</text>
    <rect x="615" y="440" width="295" height="42" class="input-error"/>
    <text x="630" y="466" class="input-val" fill="#ef4444">2023-01-01</text>
    <text x="615" y="500" class="error-msg">⚠ Deadline must be a future date.</text>
  </g>

  <!-- Field 5: Assigned Manager -->
  <g transform="translate(0, 30)">
    <text x="290" y="515" class="label">Project Manager (Owner) *</text>
    <rect x="290" y="525" width="620" height="42" class="input-box"/>
    <text x="305" y="551" class="input-val">Sarah Connor (sarah@planflow.io) ▾</text>
  </g>

  <!-- Form Actions -->
  <g transform="translate(290, 680)">
    <rect width="130" height="44" class="btn-cancel"/>
    <text x="65" y="27" class="btn-cancel-text">Cancel</text>

    <rect x="150" width="180" height="44" class="btn-primary"/>
    <text x="240" y="27" class="btn-text">Create Project →</text>
  </g>
</svg>
