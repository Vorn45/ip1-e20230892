<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .nav { fill: #1e293b; }
      .nav-text { fill: #ffffff; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 600; }
      .nav-link { fill: #94a3b8; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; }
      .nav-link.active { fill: #38bdf8; font-weight: 600; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 8; }
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: #64748b; }
      .input-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 6; }
      .text-muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: #64748b; }
      .th { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #475569; }
      .td-title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #0f172a; }
      .td { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: #334155; }
      .btn-outline { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 6; }
      .btn-outline-text { fill: #334155; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 500; text-anchor: middle; }
      .btn-text { fill: #ffffff; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="800" class="bg"/>

  <!-- Top Navigation Bar -->
  <rect width="1200" height="60" class="nav"/>
  <text x="40" y="36" class="nav-text">PlanFlow</text>
  <text x="140" y="36" class="nav-link">Projects</text>
  <text x="230" y="36" class="nav-link active">Task Explorer</text>

  <!-- Header Area -->
  <text x="40" y="110" class="title">Cross-Project Task Explorer</text>
  <text x="40" y="132" class="subtitle">Search, filter, and paginate tasks across all team projects (Stretch Feature).</text>

  <!-- Filter Controls Card -->
  <rect x="40" y="155" width="1120" height="80" class="card"/>
  
  <rect x="65" y="175" width="320" height="40" class="input-box"/>
  <text x="80" y="200" font-family="ui-sans-serif, system-ui" font-size="13px" fill="#94a3b8">Search tasks by title or keyword...</text>

  <rect x="405" y="175" width="200" height="40" class="input-box"/>
  <text x="420" y="200" class="text-muted">Project: All Projects ▾</text>

  <rect x="625" y="175" width="160" height="40" class="input-box"/>
  <text x="640" y="200" class="text-muted">Status: In Review ▾</text>

  <rect x="805" y="175" width="160" height="40" class="input-box"/>
  <text x="820" y="200" class="text-muted">Priority: All ▾</text>

  <rect x="985" y="175" width="150" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="1060" y="200" font-family="ui-sans-serif, system-ui" font-size="13px" font-weight="600" fill="#475569" text-anchor="middle">Reset Filters</text>

  <!-- Tasks Table Card -->
  <rect x="40" y="255" width="1120" height="470" class="card"/>

  <!-- Table Header -->
  <rect x="41" y="256" width="1118" height="44" fill="#f8fafc" rx="8"/>
  <text x="65" y="283" class="th">TASK TITLE</text>
  <text x="460" y="283" class="th">PROJECT</text>
  <text x="680" y="283" class="th">STATUS</text>
  <text x="800" y="283" class="th">PRIORITY</text>
  <text x="910" y="283" class="th">ASSIGNEE</text>
  <text x="1040" y="283" class="th">DUE DATE</text>

  <!-- Row 1 -->
  <line x1="40" y1="350" x2="1160" y2="350" stroke="#f1f5f9"/>
  <text x="65" y="332" class="td-title">Implement FaceID &amp; Fingerprint Biometric Prompt</text>
  <text x="460" y="332" class="td">Mobile Banking App</text>
  <rect x="680" y="318" width="75" height="20" rx="4" fill="#fef3c7"/>
  <text x="717" y="332" font-family="ui-sans-serif, system-ui" font-size="11px" font-weight="700" fill="#b45309" text-anchor="middle">IN REVIEW</text>
  <rect x="800" y="318" width="55" height="20" rx="4" fill="#fee2e2"/>
  <text x="827" y="332" font-family="ui-sans-serif, system-ui" font-size="11px" font-weight="700" fill="#b91c1c" text-anchor="middle">HIGH</text>
  <text x="910" y="332" class="td">Alex Mercer</text>
  <text x="1040" y="332" class="td">Nov 20, 2026</text>

  <!-- Row 2 -->
  <line x1="40" y1="405" x2="1160" y2="405" stroke="#f1f5f9"/>
  <text x="65" y="387" class="td-title">SAML Assertion Consumer Service Handler</text>
  <text x="460" y="387" class="td">Customer Portal SSO</text>
  <rect x="680" y="373" width="75" height="20" rx="4" fill="#fef3c7"/>
  <text x="717" y="387" font-family="ui-sans-serif, system-ui" font-size="11px" font-weight="700" fill="#b45309" text-anchor="middle">IN REVIEW</text>
  <rect x="800" y="373" width="55" height="20" rx="4" fill="#ffedd5"/>
  <text x="827" y="387" font-family="ui-sans-serif, system-ui" font-size="11px" font-weight="700" fill="#c2410c" text-anchor="middle">MEDIUM</text>
  <text x="910" y="387" class="td">Elena Rostova</text>
  <text x="1040" y="387" class="td">Nov 24, 2026</text>

  <!-- Row 3 -->
  <line x1="40" y1="460" x2="1160" y2="460" stroke="#f1f5f9"/>
  <text x="65" y="442" class="td-title">Configure Distributed Tracing with OpenTelemetry</text>
  <text x="460" y="442" class="td">Cloud Migration</text>
  <rect x="680" y="428" width="75" height="20" rx="4" fill="#fef3c7"/>
  <text x="717" y="442" font-family="ui-sans-serif, system-ui" font-size="11px" font-weight="700" fill="#b45309" text-anchor="middle">IN REVIEW</text>
  <rect x="800" y="428" width="55" height="20" rx="4" fill="#f1f5f9"/>
  <text x="827" y="442" font-family="ui-sans-serif, system-ui" font-size="11px" font-weight="700" fill="#475569" text-anchor="middle">LOW</text>
  <text x="910" y="442" class="td">John Doe</text>
  <text x="1040" y="442" class="td">Nov 28, 2026</text>

  <!-- Pagination Controls Bottom -->
  <text x="65" y="695" class="text-muted">Showing 1 to 3 of 3 tasks (filtered from 36 total)</text>
  <g transform="translate(980, 675)">
    <rect width="35" height="30" class="btn-outline"/>
    <text x="17" y="20" class="btn-outline-text">«</text>
    <rect x="45" width="35" height="30" fill="#2563eb" rx="4"/>
    <text x="62" y="20" class="btn-text">1</text>
    <rect x="90" width="35" height="30" class="btn-outline"/>
    <text x="107" y="20" class="btn-outline-text">»</text>
  </g>
</svg>
