<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .nav { fill: #1e293b; }
      .nav-text { fill: #ffffff; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 600; }
      .nav-link { fill: #94a3b8; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; }
      .nav-link.active { fill: #38bdf8; font-weight: 600; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 8; }
      .text-title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 24px; font-weight: 800; fill: #0f172a; }
      .text-subtitle { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: #64748b; }
      .text-bold { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .badge-todo { fill: #f1f5f9; }
      .badge-prog { fill: #dbeafe; }
      .badge-rev { fill: #fef3c7; }
      .badge-done { fill: #dcfce7; }
      .p-high { fill: #fee2e2; }
      .p-med { fill: #ffedd5; }
      .p-low { fill: #f1f5f9; }
      .btn { fill: #2563eb; rx: 6; }
      .btn-text { fill: #ffffff; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .btn-outline { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 6; }
      .btn-outline-text { fill: #334155; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 500; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="800" class="bg"/>

  <!-- Top Navigation Bar -->
  <rect width="1200" height="60" class="nav"/>
  <text x="40" y="36" class="nav-text">PlanFlow</text>
  <text x="140" y="36" class="nav-link active">Projects</text>
  <text x="230" y="36" class="nav-link">Task Explorer</text>

  <!-- Breadcrumb -->
  <text x="40" y="95" class="text-subtitle">Projects / Mobile Banking App Redesign (ID: 1)</text>

  <!-- Project Header Card -->
  <rect x="40" y="115" width="1120" height="130" class="card"/>
  <text x="65" y="150" class="text-title">Mobile Banking App Redesign</text>
  <rect x="440" y="132" width="75" height="22" rx="4" fill="#dcfce7"/>
  <text x="477" y="147" font-family="ui-sans-serif, system-ui" font-size="11px" font-weight="700" fill="#166534" text-anchor="middle">ACTIVE</text>
  <text x="65" y="180" class="text-subtitle">Revamp consumer iOS &amp; Android banking application UX with biometric auth.</text>
  
  <text x="65" y="215" class="text-subtitle">Deadline: Dec 15, 2026</text>
  <text x="240" y="215" class="text-subtitle">Owner: Sarah Connor (Manager)</text>
  <text x="500" y="215" class="text-subtitle">Progress: 14 / 18 Tasks (78%)</text>
  <rect x="700" y="205" width="220" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="700" y="205" width="171" height="10" rx="5" fill="#2563eb"/>

  <!-- Quick Actions -->
  <g transform="translate(980, 135)">
    <rect width="150" height="36" class="btn"/>
    <text x="75" y="23" class="btn-text">+ Add Task</text>
  </g>

  <!-- Left: Tasks Kanban / List -->
  <rect x="40" y="265" width="720" height="500" class="card"/>
  <text x="65" y="300" class="text-bold">Project Tasks (18)</text>

  <!-- Task Filter Tabs -->
  <rect x="65" y="315" width="60" height="28" rx="6" fill="#2563eb"/>
  <text x="95" y="333" class="btn-text">All (18)</text>

  <rect x="135" y="315" width="70" height="28" class="btn-outline"/>
  <text x="170" y="333" class="btn-outline-text">Todo (2)</text>

  <rect x="215" y="315" width="105" height="28" class="btn-outline"/>
  <text x="267" y="333" class="btn-outline-text">In Progress (2)</text>

  <rect x="330" y="315" width="95" height="28" class="btn-outline"/>
  <text x="377" y="333" class="btn-outline-text">In Review (1)</text>

  <rect x="435" y="315" width="80" height="28" class="btn-outline"/>
  <text x="475" y="333" class="btn-outline-text">Done (13)</text>

  <!-- Task Card 1 (In Review) -->
  <rect x="65" y="360" width="670" height="85" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="85" y="390" font-family="ui-sans-serif, system-ui" font-size="15px" font-weight="600" fill="#0f172a">Implement FaceID &amp; Fingerprint Biometric Prompt</text>
  <rect x="520" y="375" width="80" height="20" rx="4" class="badge-rev"/>
  <text x="560" y="389" font-family="ui-sans-serif, system-ui" font-size="11px" font-weight="700" fill="#b45309" text-anchor="middle">IN REVIEW</text>
  <rect x="610" y="375" width="60" height="20" rx="4" class="p-high"/>
  <text x="640" y="389" font-family="ui-sans-serif, system-ui" font-size="11px" font-weight="700" fill="#b91c1c" text-anchor="middle">HIGH</text>
  <text x="85" y="425" class="text-subtitle">Assignee: Alex Mercer | Due: Nov 20, 2026 | 3 Comments</text>

  <!-- Task Card 2 (In Progress) -->
  <rect x="65" y="455" width="670" height="85" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="85" y="485" font-family="ui-sans-serif, system-ui" font-size="15px" font-weight="600" fill="#0f172a">Design Dark Mode Navigation Drawer</text>
  <rect x="520" y="470" width="80" height="20" rx="4" class="badge-prog"/>
  <text x="560" y="484" font-family="ui-sans-serif, system-ui" font-size="11px" font-weight="700" fill="#1d4ed8" text-anchor="middle">IN PROGRESS</text>
  <rect x="610" y="470" width="60" height="20" rx="4" class="p-med"/>
  <text x="640" y="484" font-family="ui-sans-serif, system-ui" font-size="11px" font-weight="700" fill="#c2410c" text-anchor="middle">MEDIUM</text>
  <text x="85" y="520" class="text-subtitle">Assignee: Elena Rostova | Due: Nov 25, 2026 | 1 Comment</text>

  <!-- Task Card 3 (Done) -->
  <rect x="65" y="550" width="670" height="85" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="85" y="580" font-family="ui-sans-serif, system-ui" font-size="15px" font-weight="600" fill="#0f172a">Setup OAuth 2.0 PKCE Flow</text>
  <rect x="520" y="565" width="80" height="20" rx="4" class="badge-done"/>
  <text x="560" y="579" font-family="ui-sans-serif, system-ui" font-size="11px" font-weight="700" fill="#15803d" text-anchor="middle">DONE</text>
  <rect x="610" y="565" width="60" height="20" rx="4" class="p-high"/>
  <text x="640" y="579" font-family="ui-sans-serif, system-ui" font-size="11px" font-weight="700" fill="#b91c1c" text-anchor="middle">HIGH</text>
  <text x="85" y="615" class="text-subtitle">Assignee: Alex Mercer | Closed: Nov 10, 2026</text>

  <!-- Right: Selected Task Inspector / Comments Panel -->
  <rect x="780" y="265" width="380" height="500" class="card"/>
  <text x="805" y="300" class="text-bold">Task Inspector</text>
  <text x="805" y="330" font-family="ui-sans-serif, system-ui" font-size="16px" font-weight="700" fill="#0f172a">FaceID Prompt</text>
  <text x="805" y="355" class="text-subtitle">Integrate LocalAuthentication API for iOS and BiometricPrompt for Android.</text>

  <!-- Status Transition Controls -->
  <text x="805" y="390" font-family="ui-sans-serif, system-ui" font-size="12px" font-weight="600" fill="#475569">STATUS TRANSITION (Manager)</text>
  <rect x="805" y="402" width="105" height="30" rx="4" fill="#16a34a"/>
  <text x="857" y="421" class="btn-text">Approve ✓</text>
  <rect x="920" y="402" width="115" height="30" rx="4" fill="#dc2626"/>
  <text x="977" y="421" class="btn-text">Request Changes</text>

  <!-- Comments Feed -->
  <text x="805" y="465" font-family="ui-sans-serif, system-ui" font-size="14px" font-weight="700" fill="#0f172a">Discussion &amp; Notes</text>
  <rect x="805" y="480" width="330" height="75" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="815" y="500" font-family="ui-sans-serif, system-ui" font-size="12px" font-weight="600" fill="#0f172a">Alex Mercer (Assignee)</text>
  <text x="815" y="520" font-family="ui-sans-serif, system-ui" font-size="12px" fill="#475569">Tested on iOS 17.5 simulator and physical device. Fallback PIN works.</text>

  <rect x="805" y="565" width="330" height="75" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="815" y="585" font-family="ui-sans-serif, system-ui" font-size="12px" font-weight="600" fill="#0f172a">Sarah Connor (Manager)</text>
  <text x="815" y="605" font-family="ui-sans-serif, system-ui" font-size="12px" fill="#475569">Code review passes. Ready for final approval.</text>

  <!-- Add Comment Input -->
  <rect x="805" y="655" width="330" height="55" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="815" y="680" font-family="ui-sans-serif, system-ui" font-size="12px" fill="#94a3b8">Write a note or blocker...</text>
  <rect x="1055" y="720" width="80" height="28" class="btn"/>
  <text x="1095" y="738" class="btn-text">Post</text>
</svg>
