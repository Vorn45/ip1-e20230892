<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .font-bold { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-weight: 700; }
      .font-med { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-weight: 600; }
      .font-reg { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-weight: 400; }
      .text-dark { fill: #0f172a; }
      .text-muted { fill: #64748b; }
      .text-blue { fill: #2563eb; }
      .btn-reject { fill: #ffffff; stroke: #ef4444; stroke-width: 1.5; rx: 6; }
      .btn-approve { fill: #16a34a; rx: 6; }
      .btn-gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; rx: 6; }
      .btn-blue { fill: #3b82f6; rx: 6; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" class="bg"/>

  <!-- Top App Header -->
  <rect x="0" y="0" width="1200" height="70" class="header-bg"/>
  <text x="40" y="42" class="font-bold text-dark" font-size="18px">PlanFlow ផ្ទៀងផ្ទាត់ការងារ</text>
  <text x="950" y="42" class="font-med text-muted" font-size="13px">អ្នកប្រើប្រាស់: ពិសិដ្ឋ បញ្ញាវុឌ្ឍ (MANAGER)</text>

  <!-- Back Link & Page Title (Balsamiq Page 17) -->
  <text x="40" y="105" class="font-med text-blue" font-size="13px">‹ ត្រឡប់ទៅតារាងការងារ (Back to Tasks Explorer)</text>
  <text x="40" y="135" class="font-bold text-dark" font-size="22px">ផ្ទៀងផ្ទាត់ទិន្នន័យការងារ (Task Verification &amp; Details)</text>

  <!-- Main 2-Column Split Grid -->
  <!-- Left Column: Task Specifications & Approval Actions -->
  <rect x="40" y="155" width="700" height="660" class="card"/>

  <!-- Card Top Banner with Task Code -->
  <g transform="translate(65, 180)">
    <text x="0" y="24" class="font-med text-muted" font-size="13px">លេខសម្គាល់ការងារ (Task Code):</text>
    <rect x="230" y="5" width="120" height="26" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="290" y="23" class="font-bold text-blue" font-size="13px" text-anchor="middle">#000b-005</text>

    <rect x="360" y="5" width="120" height="26" rx="4" fill="#fefce8" stroke="#fde047"/>
    <text x="420" y="23" class="font-med" fill="#854d0e" font-size="12px" text-anchor="middle">CCN-024800</text>
  </g>

  <!-- Task Title & Description -->
  <text x="65" y="245" class="font-bold text-dark" font-size="20px">ផ្ទៀងផ្ទាត់ទិន្នន័យការងារ និង សេចក្តីលម្អិតបច្ចេកទេស</text>
  <text x="65" y="275" class="font-reg text-muted" font-size="14px">
    ពិនិត្យផ្ទៀងផ្ទាត់រចនាសម្ព័ន្ធទិន្នន័យ UI/UX ផ្ទាំង Dashboard និង Task Explorer ឱ្យត្រូវតាមលក្ខខណ្ឌតម្រូវ
  </text>
  <text x="65" y="295" class="font-reg text-muted" font-size="14px">
    នៃការវាយតម្លៃ Milestone 1 Frontend Prototype។
  </text>

  <!-- Metadata Table Rows -->
  <line x1="65" y1="320" x2="715" y2="320" stroke="#f1f5f9" stroke-width="1.5"/>

  <text x="65" y="355" class="font-med text-muted" font-size="14px">ប្រភេទការងារ (Category):</text>
  <text x="280" y="355" class="font-bold text-dark" font-size="14px">ការអភិវឌ្ឍ Frontend (Vue 3 / TS)</text>

  <text x="65" y="395" class="font-med text-muted" font-size="14px">កម្រិតអាទិភាព (Priority):</text>
  <rect x="280" y="378" width="80" height="24" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="320" y="394" class="font-bold" fill="#991b1b" font-size="12px" text-anchor="middle">HIGH</text>

  <text x="65" y="435" class="font-med text-muted" font-size="14px">ស្ថានភាពបច្ចុប្បន្ន (Status):</text>
  <rect x="280" y="418" width="105" height="24" rx="4" fill="#fefce8" stroke="#fde047"/>
  <text x="332" y="434" class="font-bold" fill="#854d0e" font-size="12px" text-anchor="middle">IN_REVIEW</text>

  <text x="65" y="475" class="font-med text-muted" font-size="14px">ថ្ងៃផុតកំណត់ (Due Date):</text>
  <text x="280" y="475" class="font-med text-dark" font-size="14px">📅 2026-11-20 (នៅសល់ ៥ ថ្ងៃ)</text>

  <text x="65" y="515" class="font-med text-muted" font-size="14px">អ្នកទទួលខុសត្រូវ (Assignee):</text>
  <text x="280" y="515" class="font-bold text-dark" font-size="14px">👤 ពិសិដ្ឋ បញ្ញាវុឌ្ឍ (Piseth Panhavorn)</text>

  <line x1="65" y1="545" x2="715" y2="545" stroke="#f1f5f9" stroke-width="1.5"/>

  <!-- Action Panel (Matches Balsamiq Page 17 Action Buttons) -->
  <text x="65" y="580" class="font-bold text-dark" font-size="16px">សកម្មភាពផ្ទៀងផ្ទាត់ (Verification Actions):</text>
  <text x="65" y="602" class="font-reg text-muted" font-size="13px">
    សិទ្ធិអនុម័តជាស្ថាពរត្រូវបានកំណត់ជូន Team Lead / Project Manager (Course Policy)
  </text>

  <!-- Button 1: Request Changes / Reject -->
  <g transform="translate(65, 625)">
    <rect width="280" height="46" class="btn-reject"/>
    <text x="140" y="28" class="font-bold" fill="#ef4444" font-size="14px" text-anchor="middle">✕ ស្នើសុំកែប្រែ (Request Changes)</text>
  </g>

  <!-- Button 2: Approve Verification -->
  <g transform="translate(370, 625)">
    <rect width="320" height="46" class="btn-approve"/>
    <text x="160" y="28" class="font-bold" fill="#ffffff" font-size="14px" text-anchor="middle">✓ អនុម័តការផ្ទៀងផ្ទាត់ (Approve)</text>
  </g>

  <text x="65" y="700" class="font-reg text-muted" font-size="12px">
    * ចំណាំ៖ សមាជិកធម្មតា (MEMBER) អាចដាក់ស្នើត្រឹម IN_REVIEW; មិនអាចអនុម័ត DONE ដោយផ្ទាល់ឡើយ។
  </text>

  <!-- Right Column: Discussion Feed & Notes (Balsamiq Page 18) -->
  <rect x="760" y="155" width="400" height="660" class="card"/>
  <text x="785" y="190" class="font-bold text-dark" font-size="16px">កត់សម្គាល់ និង មតិយោបល់ (Discussion)</text>
  <text x="785" y="210" class="font-reg text-muted" font-size="12px">ប្រវត្តិផ្លាស់ប្តូរ និងមតិយោបល់ពិនិត្យការងារ</text>

  <!-- Comment 1 -->
  <rect x="785" y="230" width="350" height="85" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="800" y="252" class="font-bold text-dark" font-size="13px">👤 ពិសិដ្ឋ បញ្ញាវុឌ្ឍ (Lead)</text>
  <text x="1115" y="252" class="font-reg text-muted" font-size="11px" text-anchor="end">10:15 AM</text>
  <text x="800" y="275" class="font-reg text-dark" font-size="12px">បានរៀបចំផ្ទាំង prototype និងតភ្ជាប់ Pinia store</text>
  <text x="800" y="295" class="font-reg text-dark" font-size="12px">រួចរាល់ហើយ សូមជួយពិនិត្យ។</text>

  <!-- Comment 2 -->
  <rect x="785" y="325" width="350" height="85" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="800" y="347" class="font-bold text-dark" font-size="13px">👤 Alex Mercer (Reviewer)</text>
  <text x="1115" y="347" class="font-reg text-muted" font-size="11px" text-anchor="end">11:30 AM</text>
  <text x="800" y="370" class="font-reg text-dark" font-size="12px">ទម្រង់បង្កើតការងារមាន client-side validation</text>
  <text x="800" y="390" class="font-reg text-dark" font-size="12px">និង dropzone ត្រឹមត្រូវតាម Balsamiq Page 16។</text>

  <!-- Comment 3 -->
  <rect x="785" y="420" width="350" height="85" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="800" y="442" class="font-bold text-dark" font-size="13px">👤 សុភា គីម (Designer)</text>
  <text x="1115" y="442" class="font-reg text-muted" font-size="11px" text-anchor="end">01:05 PM</text>
  <text x="800" y="465" class="font-reg text-dark" font-size="12px">ពណ៌ និង Typography ឆ្លើយតបខ្មែរ/អង់គ្លេស</text>
  <text x="800" y="485" class="font-reg text-dark" font-size="12px">បានល្អ គ្មានបញ្ហាអក្សរខូចឡើយ។</text>

  <!-- Post Comment Input Box -->
  <rect x="785" y="660" width="350" height="80" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="800" y="685" class="font-reg text-muted" font-size="13px">សរសេរមតិយោបល់ ឬការណែនាំ...</text>

  <g transform="translate(1005, 755)">
    <rect width="130" height="34" class="btn-blue"/>
    <text x="65" y="22" class="font-bold" fill="#ffffff" font-size="12px" text-anchor="middle">ផ្ញើមតិយោបល់</text>
  </g>
</svg>
